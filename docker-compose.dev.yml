services:
  backend:
    build: ./backend
    image: drimtim-backend-dev
    container_name: drimtim-backend-dev
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - ENV=development
      - CORS_ORIGINS=*
      - FRONTEND_URL=http://localhost
    volumes:
      - ./backend:/app
    networks:
      - default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: drimtim-frontend-dev
    container_name: drimtim-frontend-dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - default
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.latidos-dev.rule=PathPrefix(`/`)"
      - "traefik.http.routers.latidos-dev.entrypoints=websecure"
      - "traefik.http.routers.latidos-dev.tls=true"
      - "traefik.http.routers.latidos-dev.priority=1"
      - "traefik.http.services.latidos-dev.loadbalancer.server.port=5173"

networks:
  default:
  edge:
    external: true
