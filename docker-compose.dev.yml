services:
  backend:
    build: ./backend
    image: drimtim-backend-dev
    container_name: drimtim-backend-dev
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - ENV=development
      - CORS_ORIGINS=http://127.0.0.1:5173,http://localhost:5173
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: drimtim-frontend-dev
    container_name: drimtim-frontend-dev
    ports:
      - "80:5173"
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
